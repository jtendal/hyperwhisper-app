name: Windows Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version (X.Y.Z)
        required: true
        default: '1.14.0'
        type: string

permissions:
  contents: read

jobs:
  installers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate version
        env:
          INSTALLER_VERSION: ${{ inputs.version }}
        run: |
          if ($env:INSTALLER_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Version must be X.Y.Z' }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build x64 and ARM64 applications
        run: |
          ./tools/build-windows.ps1 -Architecture x64 -Configuration Release
          ./tools/build-windows.ps1 -Architecture arm64 -Configuration Release
      - name: Run x64 smoke tests
        run: dotnet run --project app/windows/HyperWhisper.SmokeTests -c Release
      - name: Validate retained update feed
        run: ./app/windows/HyperWhisper/scripts/validate-windows-appcast.ps1
      - name: Build unsigned installers
        working-directory: app/windows
        env:
          INSTALLER_VERSION: ${{ inputs.version }}
        run: ./build-release.ps1 -Architecture both -Version $env:INSTALLER_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: app/windows-installers/*-Setup.exe
          if-no-files-found: error
