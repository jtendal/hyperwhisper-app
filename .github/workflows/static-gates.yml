name: static-gates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: static-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (new commits only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The scan needs both ends of the range, so a shallow clone is not
          # enough.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o /tmp/gl.tgz
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan the commits this PR adds
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          echo "scanning $RANGE"
          gitleaks git --log-opts "$RANGE" --redact --no-banner .

  patterns:
    name: Closed patterns stay closed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ast-grep
        run: sudo npm i -g --prefix /usr/local @ast-grep/cli

      # Rules and their reasons live in .ast-grep/rules. A deliberate exception
      # is an `// ast-grep-ignore: <rule-id> -- <why>` comment on the line above
      # the site, so every exception is documented in the code rather than
      # remembered by whoever wrote it.
      - name: ast-grep scan
        run: ast-grep scan

  model-names:
    name: A model name lives in the catalog only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for a duplicated model name
        run: tools/check-model-name-literals.sh
